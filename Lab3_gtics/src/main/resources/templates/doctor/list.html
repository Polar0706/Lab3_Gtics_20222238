<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <title>Lista de Doctores</title>
</head>
<body>

<div th:replace="fragment/navbar :: navbar"></div>

<h1>Lista Doctores</h1>

<table>
  <tr>
    <th>Nombre</th>
    <th>Especialidad</th>
    <th>Hospital</th>
    <th>Acciones</th>
  </tr>
  <tr th:each="doctor : ${listaDoctores}">
    <td th:text="${doctor.nombre}"></td>
    <td th:text="${doctor.especialidad}"></td>
    <td th:text="${doctor.hospital.nombre}"></td>
    <td>
      <a th:href="@{'/doctores/proximascitas/' + ${doctor.id}}">Próximas citas</a>
    </td>
  </tr>
</table>

</body>
</html>
